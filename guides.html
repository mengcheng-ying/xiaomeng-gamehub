<style>
  :root{--ink:#16203a;--ink2:#495571;--muted:#8b94a8;--line:#e7ecf5;--brand:#2456c8;--brand-soft:#eef3fe;--accent:#ff9d2e;--bg:#f6f8fc;--card:#fff}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.9 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
  a{text-decoration:none;color:var(--brand)}
  img{max-width:100%}
  .topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:13px 20px}
  .brand{font-weight:700;color:var(--brand);letter-spacing:.5px;font-size:16px}
  .nav{display:flex;gap:20px}
  .nav a{color:var(--ink2);font-size:14px}
  .nav a:hover{color:var(--brand)}
  .wrap{max-width:780px;margin:0 auto;padding:34px 20px 64px}
  .wrap.wide{max-width:1040px}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:20px}
  .crumb a{color:var(--muted)}
  .crumb a:hover{color:var(--brand)}
  .crumb i{font-style:normal;margin:0 7px;opacity:.55}
  h1.ttl{font-size:29px;line-height:1.4;font-weight:700;margin:0 0 14px;letter-spacing:-.2px}

  /* ===== 搜索框 ===== */
  .srchbar{position:relative;display:flex;align-items:stretch;gap:0;margin-bottom:24px}
  .srchbar input{flex:1;height:52px;font-size:16px;padding:0 20px;border:1px solid var(--line);
    border-right:none;border-radius:12px 0 0 12px;background:var(--card);color:var(--ink);
    font-family:inherit;outline:none;transition:border-color .15s}
  .srchbar input:focus{border-color:var(--brand)}
  .srchbar .srchbtn{display:flex;align-items:center;justify-content:center;width:52px;
    border:1px solid var(--line);border-left:none;border-radius:0 12px 12px 0;
    background:var(--card);cursor:pointer;color:var(--muted);transition:color .15s,background .15s}
  .srchbar .srchbtn:hover{color:var(--brand);background:var(--brand-soft)}
  .srchbar .srchbtn svg{width:20px;height:20px}
  .srchhint{font-size:12px;color:var(--muted);margin:-18px 0 22px;text-align:right}

  /* ===== 搜索结果 ===== */
  .srch-res{margin:0 0 26px}
  .srch-res .hd{font-size:13px;color:var(--muted);margin:0 0 10px}
  .srch-res .empty{font-size:14px;color:var(--muted);padding:18px 0;margin:0}

  /* ===== 游戏攻略卡片 ===== */
  .gcards{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
  .gcard{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);transition:box-shadow .2s,border-color .2s;text-decoration:none;color:inherit}
  .gcard:hover{border-color:#cfdcf7;box-shadow:0 6px 18px rgba(20,40,80,.07)}
  .gcard .cover{border-radius:8px;overflow:hidden;background:#e9eef7}
  .gcard .cover img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
  .gcard .info{min-width:0;display:flex;flex-direction:column;gap:8px}
  .gcard .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .gcard .gname{font-size:15px;font-weight:700;color:var(--ink);margin:0}
  .gcard .gcat{font-size:11.5px;color:var(--muted);font-weight:500}
  .gcard .cnt{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);
    padding:2px 8px;border-radius:99px;white-space:nowrap}
  .gcard .alist{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
  .gcard .alist li{margin:0;padding:0}
  .gcard .alist a{display:block;font-size:13px;color:var(--ink2);padding:5px 8px;border-radius:6px;
    transition:background .15s,color .15s;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gcard .alist a:hover{background:var(--brand-soft);color:var(--brand)}
  .gcard .alist a.hit{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .gcard .alist .cat{display:inline-block;font-size:9.5px;font-weight:600;color:#fff;
    background:var(--brand);border-radius:3px;padding:1px 5px;margin-right:5px;vertical-align:middle}
  .gcard .alist .cat.info{background:var(--accent)}
  .gcard .more{font-size:11.5px;color:var(--muted);margin-top:0}
  .gcard.collapsed{display:none}

  /* ===== 展开更多按钮 ===== */
  .more-btn{display:block;width:100%;padding:12px;margin:6px 0 24px;border:1px dashed var(--line);
    border-radius:10px;background:var(--card);color:var(--ink2);font-size:13px;font-weight:600;
    text-align:center;cursor:pointer;transition:border-color .18s,color .18s;font-family:inherit}
  .more-btn:hover{border-color:var(--brand);color:var(--brand)}

  /* ===== 文末返回首页按钮 ===== */
  .cta{margin:44px 0 0;padding:26px 22px;text-align:center;background:linear-gradient(135deg,#f2f6ff,#eaf1ff);
    border:1px solid #dbe6fb;border-radius:14px}
  .cta p{margin:0 0 16px;font-size:15px;color:var(--ink2)}
  .cta-btn{display:inline-block;font-size:15px;font-weight:600;color:#fff!important;background:var(--brand);
    padding:12px 30px;border-radius:99px;box-shadow:0 6px 18px rgba(36,86,200,.25);transition:transform .15s,box-shadow .15s}
  .cta-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(36,86,200,.3)}

  /* ===== 页脚 ===== */
  .foot{text-align:center;padding:34px 20px;border-top:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted)}
  .foot a{color:var(--muted);margin:0 10px}
  .foot a:hover{color:var(--brand)}

  /* ===== 手机端适配 ===== */
  @media (max-width:640px){
    .wrap{padding:24px 16px 52px}
    h1.ttl{font-size:23px}
    .nav{gap:14px}
    .srchbar input{height:62px;font-size:17px;padding:0 18px;border-radius:16px 0 0 16px}
    .srchbar .srchbtn{width:62px;border-radius:0 16px 16px 0}
    .srchbar .srchbtn svg{width:24px;height:24px}
    .gcard{grid-template-columns:96px 1fr;gap:12px;padding:12px;border-radius:12px}
    .gcard .cover{border-radius:8px}
    .gcard .cover img{aspect-ratio:auto;min-height:72px}
    .gcard .info{gap:6px}
    .gcard .top{gap:8px}
    .gcard .gname{font-size:14px}
    .gcard .gcat{font-size:11px}
    .gcard .cnt{font-size:10.5px;padding:2px 7px}
    .gcard .alist{gap:4px}
    .gcard .alist a{font-size:12.5px;padding:4px 7px;line-height:1.4;border-radius:6px}
    .gcard .alist .cat{font-size:9px;padding:1px 5px;margin-right:4px}
    .gcard .more{font-size:11px;margin-top:0}
  }
</style>
</head>
