name: IndexNow 即时提交（Bing / Naver / Seznam / Yandex）

# 作用：站点内容更新并推送后，主动告诉这些搜索引擎「URL 变了」，
#       让它们立刻来抓取，加快收录速度。
# 触发：只在「可被索引的内容页」变化时触发，避免每次无关提交都空跑。

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'games.html'
      - 'guides.html'
      - 'news.html'
      - '404.html'
      - 'article/**'
      - 'game/**'
      - 'news/**'
      - 'sitemap.xml'
  workflow_dispatch:

# 只读权限：本工作流只需要读 sitemap 后对外发请求，不需要写仓库。
# 原来没声明 permissions，会拿到仓库默认的写权限，属于不必要的授权。
permissions:
  contents: read

# 独立并发组：IndexNow 不写 main，不必和三个写 main 的工作流抢同一把锁。
# cancel-in-progress: false —— 提交动作不中途取消，避免只推了一半 URL。
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # action 固定到 commit SHA（供应链加固），升级时换对应 tag 的 SHA 即可
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      # 站点由 Cloudflare Pages 在 push 后自动构建部署，
      # 稍等片刻确保本轮内容已上线，再提交 URL 给搜索引擎。
      - name: 等待 Cloudflare Pages 部署完成
        run: sleep 90

      - name: 提交 sitemap 全部 URL 到 IndexNow
        run: node scripts/indexnow-ping.js