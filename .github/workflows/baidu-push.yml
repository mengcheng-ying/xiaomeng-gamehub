name: 百度链接自动推送

on:
  schedule:
    - cron: '30 19 * * *'   # 每天北京时间 03:30（UTC 19:30）定时逐条推送
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: '推送模式：incremental=增量(默认) / full=全量 / onebyone=逐条推到配额上限'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - onebyone

jobs:
  baidu-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取完整历史，保证 git diff HEAD~1 可用
          fetch-depth: 2

      - name: 推送链接到百度
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "full" ]; then
              node .github/scripts/baidu-push.js --all
            elif [ "${{ inputs.mode }}" = "incremental" ]; then
              node .github/scripts/baidu-push.js
            else
              node .github/scripts/baidu-push-onebyone.js
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # 每日定时逐条推送，把当前全部链接一条条提交给百度，用满当日配额
            node .github/scripts/baidu-push-onebyone.js
          else
            node .github/scripts/baidu-push.js
          fi
