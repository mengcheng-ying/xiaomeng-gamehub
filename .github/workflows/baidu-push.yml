name: 百度链接自动推送

# ── 为什么这样配置（改之前先读完，别把踩过的坑再踩一遍）──────────────
# 2026-09-14：旧配置把定时排在凌晨 03:30、同时又挂 on: push，结果凌晨那次
#   把当天配额一次吃光，白天新上线的页面一条都推不进去（当天触发 5 次，
#   后 4 次全撞 over quota 空跑）；旧脚本还固定从 sitemap 第 1 条开始推、
#   遇上限就 break、没有任何状态记录，于是每天重复推同一批「首页/列表页」，
#   排在后半段的游戏页永远轮不到。
#   → 改为「只在每日 13:00 定时推一次」+ 状态文件记录已推 URL。
# 2026-09-29：实测发现定时从 09-20 起就再没触发过 —— 全仓库唯一一次 schedule
#   运行停在 09-20（仓库设置正常、Actions 未禁用、默认分支正常），头号嫌疑是
#   这个仓库的历史被反复重写。单押一个定时不可靠，故改为三层叠加：
#     ① 定时挪离整点（GitHub 的定时器在整点最容易被延迟甚至跳过）
#     ② 再加一条晚些的兜底定时
#     ③ 内容更新即推（on: push），不依赖定时
#   「多次推送互抢配额」这个当年的顾虑现在已被脚本自身化解，所以 ③ 是安全的：
#   scripts/baidu-push-priority.js 只推状态文件里没推过的 URL、单次上限 10 条、
#   撞到 over quota 立刻停手 —— 一天里多跑几次最多是空跑，既不会重复提交，
#   也不会互相抢配额（百度明确说高频重复提交会拉低站点评级）。

on:
  schedule:
    # 主定时：北京时间 13:23（UTC 05:23），晚于每天 12:00 的内容同步。
    # 刻意避开整点：GitHub 的定时器在整点被延迟或直接跳过的概率最高。
    - cron: '23 5 * * *'
    # 兜底定时：北京时间 15:41（UTC 07:41）。主定时被跳过时由这条补上；
    # 已推过的 URL 由状态文件挡住，配额用尽脚本自己会停，不会重复提交。
    - cron: '41 7 * * *'
  # 发布即推：内容一更新就推新页面，不必等第二天的定时。
  # 只列内容路径、不含 .github/** —— 本工作流自己提交的状态文件不会反过来触发自己。
  push:
    branches: [main]
    paths:
      - 'data/articles.js'
      - 'sitemap.xml'
      - 'index.html'
      - 'article/**'
      - 'guides/**'
      - 'gift/**'
      - 'game/**'
  workflow_dispatch:
    inputs:
      max:
        description: '本次最多推送条数（默认 10，与每日配额量级匹配）'
        required: false
        default: '10'
        type: string
      dry:
        description: '只演练不发送（不消耗配额）'
        required: false
        default: false
        type: boolean

# 2026-10-09：本工作流与「站点重建」抢推 main，状态文件丢过一次。
#   新游戏上线那个 commit 同时触发了 rebuild 和本工作流；本工作流推完 10 条链接后
#   要提交状态文件，rebuild 这时刚好把构建产物推上 main，于是本工作流被拒：
#     ! [rejected]  main -> main (fetch first)
#   本地那个 commit 随 runner 一起销毁 → 白推一天：状态文件仍停在旧记录，
#   第二天会把同一批 URL 再推一遍，白白吃掉当天配额，新页面还得往后排。
#   两道防线：① 与 rebuild 共用同一个 concurrency 组，两边串行，不再并行 push；
#             ② 提交状态前先 rebase 一次，万一还有其它 push 插入也能自动跟上。
concurrency:
  group: site-rebuild
  cancel-in-progress: false

jobs:
  baidu-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 提交推送状态文件需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 推送链接到百度（带状态与优先级）
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          MAX="${{ inputs.max }}"
          if [ -z "$MAX" ]; then MAX=10; fi
          ARGS="--max=$MAX"
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          echo "运行参数：$ARGS"
          node scripts/baidu-push-priority.js $ARGS

      - name: 提交推送状态（让明天的运行接着往下推）
        run: |
          if [ ! -f .github/baidu-push-state.json ]; then
            echo "没有状态文件，跳过"
            exit 0
          fi
          git config user.name "gamehub-bot"
          git config user.email "actions@github.com"
          git add .github/baidu-push-state.json
          if git diff --cached --quiet; then
            echo "状态无变化，无需提交"
            exit 0
          fi
          git commit -m "chore(baidu): 记录本次已推送 URL"
          # 并发兜底：先把远端新提交收进来再推（正常被 concurrency 串行化后不会走到这一步）
          git pull --rebase --autostash
          git push
