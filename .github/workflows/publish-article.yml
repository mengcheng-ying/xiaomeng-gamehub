name: 工单发布文章

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    # 只处理"发布文章"表单提交的工单（表单正文必含 "### 游戏名" 标题）
    if: contains(github.event.issue.body, '### 游戏名')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Markdown 转换库
        run: npm install marked@12 --prefix .github/scripts --silent

      - name: 解析工单并生成文章
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/publish-article.js

      - name: 生成独立攻略页并重建 sitemap
        run: node scripts/build-articles.js

      - name: 提交并推送（触发网站自动部署）
        run: |
          git config user.name "gamehub-bot"
          git config user.email "actions@github.com"
          git add data/articles.js sitemap.xml article/ scripts/ index.html guides.html games.html 404.html
          git commit -m "发文：${ARTICLE_TITLE}"
          git push

      - name: 评论并关闭工单
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUM" --body "文章已发布上线 ✅
          《${ARTICLE_TITLE}》
          静态页（可被搜索引擎收录）：https://fmbly.com/article/${ARTICLE_ID}
          站内浏览：https://fmbly.com/#guide/${ARTICLE_ID}
          约 2 分钟后可在网站看到。"
          gh issue close "$ISSUE_NUM"
