name: 站点重建（攻略静态页 / 索引页 / 图片压缩）

# 触发条件刻意只包含「源文件」，不包含产物（article/、guides.html、*_headers 等）。
# 这样机器人自己提交产物时不会再触发本工作流，天然避免了循环构建。
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build-articles.js'
      - 'scripts/optimize-images.py'
  workflow_dispatch:

concurrency:
  group: site-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Pillow（图片压缩依赖）
        run: pip install --quiet pillow

      - name: 压缩图片体积（幂等，已达标的图片自动跳过）
        run: python scripts/optimize-images.py

      - name: 预渲染攻略静态页 / 生成索引页 / 重建 sitemap
        run: node scripts/build-articles.js

      - name: 提交并推送（触发 Cloudflare Pages 重新部署）
        run: |
          git config user.name "gamehub-bot"
          git config user.email "actions@github.com"
          git add -A article game news guides.html games.html news.html 404.html index.html sitemap.xml assets/images data
          if git diff --cached --quiet; then
            echo "本次构建没有产生变化，无需提交"
            exit 0
          fi
          git commit -m "build: 重建攻略静态页与索引页并压缩图片体积"
          git push
