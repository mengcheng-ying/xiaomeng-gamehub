name: 站点重建（攻略静态页 / 索引页 / 图片压缩）

# 触发条件刻意只包含「源文件」，不包含产物（article/、guides.html、*_headers 等）。
# 这样机器人自己提交产物时不会再触发本工作流，天然避免了循环构建。
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build-articles.js'
      - 'scripts/optimize-images.py'
  workflow_dispatch:

concurrency:
  group: site-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Pillow（图片压缩依赖）
        run: pip install --quiet pillow

      - name: 压缩图片体积（幂等，已达标的图片自动跳过）
        run: python scripts/optimize-images.py

      - name: 预渲染攻略静态页 / 生成索引页 / 重建 sitemap
        run: node scripts/build-articles.js

      - name: 提交并推送（触发 Cloudflare Pages 重新部署）
        run: |
          git config user.name "gamehub-bot"
          git config user.email "actions@github.com"
          # 2026-09-28 改为 add -A：原来写死了 article/game/news/... 一串路径，
          # 而 git 对「存在但一个文件都没有」的目录会报
          #   fatal: pathspec 'news' did not match any files（退出码 128）
          # 清空全部文章与公告后 article/、news/ 双双落空，这一步直接把工作流跑挂。
          # 构建产物是脚本全量重写的，用 -A 收全部改动既等价又不会再被目录增删搞崩。
          # （IDE 生成的 .trae-html-share-packages 已在 .gitignore 里，不会被带上）
          git add -A
          if git diff --cached --quiet; then
            echo "本次构建没有产生变化，无需提交"
            exit 0
          fi
          git commit -m "build: 重建攻略静态页与索引页并压缩图片体积"
          # 2026-10-09 补：同一次 push 会同时触发本工作流与「百度链接自动推送」，
          # 两边都要往 main 推提交，抢在一起时本工作流会被拒
          #   ! [rejected] main -> main (fetch first)
          # 而脚本产物随 runner 一起销毁 —— 2026-10-09 合并子域名官网那次，
          # 压缩好的 23 张图就是这么丢的，线上一直是未压缩的大图。
          # concurrency 组只是「减弱」并发，仓库里还有别的推送方（定时任务、人工提交），
          # 所以这里在 push 前再收一次远端改动，失败则重试一次。
          git pull --rebase --autostash
          git push || { echo "首次 push 被拒，rebase 后重试"; git pull --rebase --autostash; git push; }
