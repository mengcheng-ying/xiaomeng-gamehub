name: 站点重建（攻略静态页 / 索引页 / 图片压缩）

# 触发条件刻意只包含「源文件」，不包含产物（article/、guides.html、*_headers 等）。
# 这样机器人自己提交产物时不会再触发本工作流，天然避免了循环构建。
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build-articles.js'
      - 'scripts/optimize-images.py'
  workflow_dispatch:

concurrency:
  # 与「工单发布文章」「百度推送」共用 main-writer 锁：三者都要往 main 提交，
  # 串行执行避免 push 互相踩（原来这里单独用 site-rebuild 组，锁不住另外两个）。
  group: main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # action 固定到 commit SHA（供应链加固），升级时换对应 tag 的 SHA 即可
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      # 锁死版本：原来是不带版本的 pip install pillow，每次构建都可能装上不同的最新版，
      # 图片压缩是可复现的产物，不该随上游发版而变。12.3.0 支持 Python >=3.10，含 cp312 wheel。
      - name: 安装 Pillow（图片压缩依赖，版本锁定）
        run: pip install --quiet pillow==12.3.0

      - name: 压缩图片体积（幂等，已达标的图片自动跳过）
        run: python scripts/optimize-images.py

      - name: 预渲染攻略静态页 / 生成索引页 / 重建 sitemap
        run: node scripts/build-articles.js

      - name: 提交并推送（触发 Cloudflare Pages 重新部署）
        run: |
          git config user.name "gamehub-bot"
          git config user.email "actions@github.com"
          # 2026-09-28 改为 add -A：原来写死了 article/game/news/... 一串路径，
          # 而 git 对「存在但一个文件都没有」的目录会报
          #   fatal: pathspec 'news' did not match any files（退出码 128）
          # 清空全部文章与公告后 article/、news/ 双双落空，这一步直接把工作流跑挂。
          # 构建产物是脚本全量重写的，用 -A 收全部改动既等价又不会再被目录增删搞崩。
          # （IDE 生成的 .trae-html-share-packages 已在 .gitignore 里，不会被带上）
          git add -A
          if git diff --cached --quiet; then
            echo "本次构建没有产生变化，无需提交"
            exit 0
          fi
          git commit -m "build: 重建攻略静态页与索引页并压缩图片体积"
          ok=0
          for i in 1 2 3; do
            echo "第 $i 次尝试：先 rebase 再 push"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            if git push; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "✖ 推送失败：3 次重试后仍未成功"
            exit 1
          fi
